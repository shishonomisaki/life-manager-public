name: 2. 建置 APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: 沒有 google-services.json 時用假的（只能編譯，不能登入）
        run: |
          if [ ! -f app/google-services.json ]; then
            cp ../.github/ci/google-services.placeholder.json app/google-services.json
            echo "::warning::app/google-services.json 不存在，這次建置的 APK 無法登入"
          fi

      - name: 檢查簽章金鑰
        run: |
          if [ ! -f app/keystore.properties ]; then
            echo "::warning::還沒有簽章金鑰：請先執行 Actions →「1. 初始化（產生簽章金鑰）」。這次用臨時金鑰建置，Google 登入不會成功。"
          fi

      - name: 測試與建置
        run: ./gradlew :core:test :feature:telegram:test assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: life-manager-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # 另外發到 GitHub Release，手機登入 GitHub 後可以直接下載 APK（不用解壓縮、不會過期），再用 LINE 傳給家人。
      # PR：每個 PR 一個固定的「測試版」，每次推送更新成最新的；main：每次發一個新版本。
      - name: 發佈到 GitHub Release
        # 公開範本本身只檢查能不能編譯，不發 APK（沒有 Firebase 設定，裝了也無法登入）。
        if: github.repository != 'shishonomisaki/life-manager-public' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$PR" ]; then
            TAG=pr-$PR; APK=life-manager-pr$PR.apk; FLAG=--prerelease
            TITLE="測試版：PR #$PR（$BRANCH）"
            gh release delete "$TAG" --cleanup-tag --yes || true
          else
            TAG=build-${{ github.run_number }}; APK=life-manager-${{ github.run_number }}.apk; FLAG=--latest
            TITLE="生活管理 #${{ github.run_number }}"
          fi
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          gh release create "$TAG" "$APK" --target "$SHA" $FLAG --title "$TITLE" \
            --notes "從 $BRANCH 自動建置（${SHA::7}）。在手機上點 $APK 下載安裝。"
